name: Build and Deploy Backend to SmarterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore RetailOS.sln

    - name: Build & Publish Release Bundle
      run: dotnet publish src/RetailOS.Api/RetailOS.Api.csproj -c Release -o ./publish

    - name: Deploy via FTP to SmarterASP.NET
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: ${{ secrets.FTP_REMOTE_DIR || '/site1/' }}
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/appsettings.Production.json
